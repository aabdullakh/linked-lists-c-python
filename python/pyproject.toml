[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linked-lists"
version = "1.0.0"
description = "Linked list implementations (singly, doubly, LRU cache) for a data structures course"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]       # tests import `linked_lists` without installing it
testpaths = ["tests"]
addopts = "-ra"
